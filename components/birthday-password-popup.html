<!-- Birthday Corner Password Popup -->
<div id="birthdayPasswordPopup" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden items-center justify-center p-4 transition-all duration-300">
    <div class="bg-gradient-to-br from-rose-50 to-amber-50 rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden transform scale-95 opacity-0 transition-all duration-300 modal-anim flex flex-col border border-rose-100">
        <div class="p-6 pb-4 bg-gradient-to-r from-rose-400 to-pink-500 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center">
                    <i data-lucide="lock" class="w-5 h-5 text-white"></i>
                </div>
                <div>
                    <h3 class="text-lg font-bold text-white tracking-tight">Birthday Corner</h3>
                    <span class="text-[10px] text-white/80 font-medium">Enter password to continue</span>
                </div>
            </div>
            <button class="close-birthday-pwd w-8 h-8 rounded-lg bg-white/20 flex items-center justify-center text-white hover:bg-white/30 transition">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>
        <div class="p-6">
            <div class="bg-white rounded-2xl p-4 mb-4 shadow-sm">
                <input type="password" id="birthdayPassword" placeholder="Enter password" class="w-full text-center text-lg font-bold tracking-widest text-gray-800 bg-transparent border-b-2 border-gray-200 focus:border-rose-400 focus:outline-none py-2" maxlength="4">
            </div>
            <p id="passwordError" class="text-xs text-red-500 text-center mb-4 hidden">Incorrect password. Try again!</p>
            <button id="submitPassword" class="w-full py-3 bg-gradient-to-r from-rose-500 to-pink-500 text-white rounded-xl font-semibold hover:opacity-90 transition">
                Unlock
            </button>
        </div>
    </div>
</div>
