<!-- Archive Gallery Popup -->
<div id="archivePopup" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden items-center justify-center p-3 md:p-4 transition-all duration-300">
    <div class="bg-gradient-to-br from-white to-gray-50 rounded-2xl md:rounded-3xl shadow-2xl w-full max-w-sm md:max-w-sm overflow-hidden transform scale-95 opacity-0 transition-all duration-300 modal-anim flex flex-col border border-gray-100 max-h-[90vh] md:max-h-none">
        <div class="p-3 md:p-4 pb-2 md:pb-3 bg-gradient-to-r from-blue-900 to-blue-800 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-7 h-7 md:w-8 md:h-8 bg-white/20 rounded-lg md:rounded-lg flex items-center justify-center">
                    <i data-lucide="images" class="w-3 h-3 md:w-4 md:h-4 text-white"></i>
                </div>
                <div>
                    <h3 class="text-sm md:text-base font-bold text-white tracking-tight">Gallery</h3>
                    <span class="text-[8px] md:text-[10px] text-blue-100 font-medium">5 Memories</span>
                </div>
            </div>
            <button id="closeArchive" class="close-archive w-6 h-6 md:w-7 md:h-7 rounded-lg bg-white/20 flex items-center justify-center text-white hover:bg-white/30 transition">
                <i data-lucide="x" class="w-3 h-3 md:w-4 md:h-4"></i>
            </button>
        </div>
        <div class="p-3 md:p-4">
            <div class="grid grid-cols-2 gap-1.5 md:gap-2">
                <div class="col-span-2 rounded-lg md:rounded-xl overflow-hidden aspect-video">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80" alt="Photo 1" class="w-full h-full object-cover hover:scale-110 transition transform duration-300 cursor-pointer">
                </div>
                <div class="rounded-lg md:rounded-xl overflow-hidden aspect-square">
                    <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=200&q=80" alt="Photo 2" class="w-full h-full object-cover hover:scale-110 transition transform duration-300 cursor-pointer">
                </div>
                <div class="rounded-lg md:rounded-xl overflow-hidden aspect-square">
                    <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=200&q=80" alt="Photo 3" class="w-full h-full object-cover hover:scale-110 transition transform duration-300 cursor-pointer">
                </div>
                <div class="rounded-lg md:rounded-xl overflow-hidden aspect-square">
                    <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=200&q=80" alt="Photo 4" class="w-full h-full object-cover hover:scale-110 transition transform duration-300 cursor-pointer">
                </div>
                <div class="rounded-lg md:rounded-xl overflow-hidden aspect-square">
                    <img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=200&q=80" alt="Photo 5" class="w-full h-full object-cover hover:scale-110 transition transform duration-300 cursor-pointer">
                </div>
            </div>
        </div>
        <div class="px-3 md:px-4 pb-3 md:pb-4">
            <div class="bg-gray-100 rounded-lg md:rounded-xl p-2 md:p-3 flex items-center justify-between">
                <span class="text-[10px] md:text-xs font-medium text-gray-600">Swipe to see more</span>
                <div class="flex gap-1">
                    <span class="w-1.5 h-1.5 bg-blue-900 rounded-full"></span>
                    <span class="w-1.5 h-1.5 bg-gray-300 rounded-full"></span>
                    <span class="w-1.5 h-1.5 bg-gray-300 rounded-full"></span>
                </div>
            </div>
        </div>
    </div>
</div>
