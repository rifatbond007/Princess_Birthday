<!-- Trash Popup -->
<div id="trashPopup" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden items-center justify-center p-3 md:p-4 transition-all duration-300">
    <div class="bg-white rounded-2xl md:rounded-[28px] shadow-2xl w-full max-w-md overflow-hidden transform scale-95 opacity-0 transition-all duration-300 modal-anim flex flex-col max-h-[90vh] md:max-h-none">
        <div class="p-4 md:p-6 pb-3 md:pb-4 bg-gray-50 border-b border-gray-100 flex items-center justify-between">
            <div class="flex items-center gap-2 md:gap-3">
                <div class="w-8 h-8 md:w-10 md:h-10 bg-gray-200 rounded-lg md:rounded-xl flex items-center justify-center text-gray-600">
                    <i data-lucide="trash-2" class="w-4 h-4 md:w-5 md:h-5"></i>
                </div>
                <div>
                    <h3 class="text-lg md:text-xl font-bold text-gray-900 tracking-tight">Trash</h3>
                    <span class="text-[10px] md:text-xs text-gray-500 font-medium">Empty trash</span>
                </div>
            </div>
            <button class="close-popup w-7 h-7 md:w-8 md:h-8 rounded-lg md:rounded-xl bg-gray-200 flex items-center justify-center text-gray-600 hover:bg-gray-300 transition ml-2">
                <i data-lucide="x" class="w-3 h-3 md:w-4 md:h-4"></i>
            </button>
        </div>
        <div class="p-3 md:p-6 text-center">
            <div class="w-16 h-16 md:w-20 md:h-20 mx-auto mb-3 md:mb-4 bg-gray-100 rounded-full flex items-center justify-center">
                <i data-lucide="trash-2" class="w-8 h-8 md:w-10 md:h-10 text-gray-400"></i>
            </div>
            <p class="text-sm md:text-base text-gray-600 mb-1">Trash is empty</p>
            <p class="text-xs text-gray-400">Items you delete will appear here</p>
        </div>
        <div class="p-3 md:p-4 border-t border-gray-100">
            <button class="close-popup w-full py-2 md:py-2.5 bg-gray-100 text-gray-700 rounded-lg md:rounded-xl text-xs md:text-sm font-medium hover:bg-gray-200 transition">
                Close
            </button>
        </div>
    </div>
</div>
